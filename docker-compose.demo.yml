# STAMP v1.0 Demo Docker Compose — OPTIONAL
# This is a minimal demo configuration. Local PowerShell startup is preferred for workshops.
# Usage (optional): docker-compose -f docker-compose.demo.yml up --build

version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - STAMP_DATABASE_URL=sqlite:///./stamp.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

# Note: For real workshop use, prefer ./scripts/start-stamp-demo.ps1
# Docker is provided as an optional containerization path only.
